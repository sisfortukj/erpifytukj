<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin - ERPify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="style.css">
<style>
body{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102542,#207ae0);padding:20px}.login-card{width:min(100%,430px);background:#fff;border-radius:16px;padding:34px;box-shadow:0 20px 50px rgba(0,0,0,.2)}.login-logo{text-align:center;margin-bottom:24px}.login-logo img{width:64px;height:64px;object-fit:contain}.login-logo h1{font-size:1.5rem;color:var(--navy);margin:8px 0 0}.login-logo p{font-size:.875rem;color:var(--gray-500);margin:4px 0}.form-group{margin-bottom:16px}.form-group label{display:block;font-size:.875rem;font-weight:600;margin-bottom:6px;color:var(--navy)}.form-group input{width:100%;padding:12px;border:1px solid #d7dee8;border-radius:8px;font:inherit}.login-error,.login-success{display:none;margin-top:16px;padding:10px;border-radius:7px;font-size:.875rem}.login-error{color:#b42318;background:#fef3f2}.login-success{color:#167044;background:#ecfdf3}
</style>
</head>
<body>
<main class="login-card">
<div class="login-logo"><img src="Logo ERP.png" alt="ERPify"><h1>ERPify Admin</h1><p>Masuk ke panel administrasi</p></div>
<div class="form-group"><label>Username</label><input type="text" id="loginUsername" placeholder="Masukkan username" autofocus></div>
<div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="Masukkan password" onkeydown="if(event.key==='Enter')loginAdmin()"></div>
<button class="btn btn-primary" onclick="loginAdmin()" style="width:100%;justify-content:center;margin-top:8px;"><i class="fas fa-sign-in-alt"></i> Masuk</button>
<div class="login-error" id="loginError"><i class="fas fa-exclamation-circle"></i> Username atau password salah!</div><div class="login-success" id="loginSuccess"><i class="fas fa-check-circle"></i> Login berhasil, mengarahkan...</div>
</main>
<script src="data.js"></script>
<script>
// Login diproses di server (Hostinger). Bila backend belum aktif,
// otomatis memakai pemeriksaan lokal seperti versi statis.
async function loginAdmin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value.trim();
    const errorEl = document.getElementById('loginError');
    const successEl = document.getElementById('loginSuccess');
    if (!username || !password) {
        errorEl.textContent = 'Username dan password harus diisi!';
        errorEl.style.display = 'block';
        return;
    }
    errorEl.style.display = 'none';
    const hasil = await apiLogin(username, password);
    if (hasil && hasil.ok === true) {
        sessionStorage.setItem('erpify_admin_logged_in', 'true');
        sessionStorage.setItem('erpify_admin_need_password_change', hasil.needPasswordChange ? 'true' : 'false');
        successEl.style.display = 'block';
        setTimeout(function() { window.location.href = 'admin.html'; }, 700);
        return;
    }
    if (hasil && hasil.offline) {
        loginLokal(username, password);
        return;
    }
    errorEl.textContent = (hasil && hasil.error) ? hasil.error : 'Username atau password salah!';
    errorEl.style.display = 'block';
    successEl.style.display = 'none';
}

// Mode lokal (dipakai hanya bila backend tidak dapat dihubungi)
function loginLokal(username, password) {
    const errorEl = document.getElementById('loginError');
    const successEl = document.getElementById('loginSuccess');
    const admin = getData().adminAccount;
    if (admin && admin.username === username && admin.password === password) {
        errorEl.style.display = 'none';
        successEl.style.display = 'block';
        const lastChange = admin.lastPasswordChange ? new Date(admin.lastPasswordChange) : new Date(0);
        const now = new Date();
        const diffMonths = (now.getFullYear() - lastChange.getFullYear()) * 12 + (now.getMonth() - lastChange.getMonth());
        sessionStorage.setItem('erpify_admin_logged_in', 'true');
        sessionStorage.setItem('erpify_admin_need_password_change', diffMonths >= 3 ? 'true' : 'false');
        setTimeout(function() { window.location.href = 'admin.html'; }, 700);
    } else {
        errorEl.textContent = 'Username atau password salah!';
        errorEl.style.display = 'block';
        successEl.style.display = 'none';
    }
}
</script>
</body></html>
